[package]
name = "dsh-x"
version = "0.1.24"
edition = "2021"
rust-version = "1.82"
description = "DSH-X 原生外壳：托盘 + egui 面板 + 本机桥"
publish = false

[[bin]]
name = "dsh-x"
path = "src/main.rs"

[build-dependencies]
serde_json = "1"

[dependencies]
eframe = "0.37"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3"
notify-rust = "4"
open = "5"
rfd = "0.17"
arboard = "3"
tray-icon = "0.26"
# 托盘图标要从 assets/icon.png 缩出来；只开 png，别把整套编解码器拖进来。
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
