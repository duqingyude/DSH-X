# cargo-packager 的配置：Rust 外壳的四个产物（Windows NSIS / macOS dmg / Linux AppImage + deb）。
# 路径都相对这个文件（shell-rs/）：脚本 scripts/pack-rs.mjs 先把核心层铺到 ../release/rs-stage/core，
# 再从这里把它打进安装包。
#
# 身份字段（identifier）必须和根目录 fork.json 的 appId 相等——两处都写是因为 cargo-packager
# 只认静态配置；pack-rs.mjs 与 test/fork-identity.test.mjs 会核对，改身份时两处一起改（§11.8）。
# version 同理：必须等于 Cargo.toml 的 package.version，脚本校验。
name = "dsh-x"
product_name = "DSH-X"
version = "0.1.24"
identifier = "io.github.duqingyude.dsh-x"
description = "DSH-X 原生外壳：托盘 + egui 面板 + 本机桥"
authors = ["duqingyude"]
homepage = "https://github.com/duqingyude/DSH-X"
out_dir = "../release/packager"

# 二进制由 pack-rs.mjs 先 cargo build --release 出来；这里只声明路径，NSIS 会自己补 .exe。
binaries_dir = "target/release"
binaries = [{ path = "dsh-x", main = true }]
icons = ["../assets/icon.ico", "../assets/icon.png"]

# 核心层：resources 在 NSIS / AppImage 里落在可执行文件旁边的 core/，deb 落在 usr/lib/core，
# macOS 落在 .app 的 Contents/Resources/core——supervisor::core_dir 四个候选位置都认。
resources = [{ src = "../release/rs-stage/core", target = "core" }]

[nsis]
# 每用户安装：不需要管理员权限，装到 %LOCALAPPDATA%\Programs\DSH-X。
# 旧 Electron 版装在 Programs\DSH（不同目录），装新包前要先卸载它，两者不能共存。
installer_mode = "currentUser"
# cargo-packager 把 currentUser 的默认目录写死成 %LOCALAPPDATA%\<产物名>，没有配置项能改，
# 只能换模板。模板是我们抄的一份（nsis/installer.nsi），相对上游改了默认目录、旧目录校验、卸载递归删目录，
# 另外把 MUI_UNICON 也指向同一个图标（上游只设安装程序的 MUI_ICON）。
# 路径相对 shell-rs/（pack-rs.mjs 以 shell-rs/ 为工作目录跑 cargo packager）。
template = "nsis/installer.nsi"
# 安装界面中文：cargo-packager 默认只插 English，写 SimpChinese 后欢迎页、目录页、完成页、
# 卸载确认页（以及「程序正在运行」这类提示）全部走 MUI 自带的中文语言包。只有一个语言，
# 所以不会弹语言选择框。要加英文就把 English 一并列进来。
languages = ["SimpChinese"]
# 安装包自己的图标（资源管理器里双击的那个 exe、安装向导左上角、卸载程序）。不写就用 NSIS 的默认图标；
# 应用图标是嵌进 dsh-x.exe 的资源段（shell-rs/build.rs + icon.rc），cargo-packager 不管那一步。
installer_icon = "../assets/icon.ico"

[macos]
# 与 Electron 版一致：只有 ad-hoc 签名（拿不到 Developer ID 的 arm64 包会被 Gatekeeper 判成已损坏），
# 所以外壳自更新在 mac 上先不提供。
signing_identity = "-"
