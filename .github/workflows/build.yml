# 打包：推 tag（或手动触发）时在 GitHub 的机器上出安装包；mac 的包只能在 macOS 上打（hdiutil 是独有命令）。
#
# 只上传资产、不创建 Release：Release 与中文发行说明仍按本地流程建，建完这里把产物补上去。
# 打包走 cargo-packager（shell-rs/Packager.toml），核心 npm 包在 Linux job 里发（跨平台一份）。
#
# 产物：Windows NSIS、Linux AppImage + deb、macOS dmg（mac 要 .icns，没有就先跳过）。
# 签名的 minisign 私钥走 CARGO_PACKAGER_SIGN_PRIVATE_KEY（和 release-key.pem 一样的规矩：不进库）。
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 核心与页面零运行时依赖，不用 npm ci；打包脚本只用 node: 内置模块。
      - name: 跑测试
        run: npm test

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell-rs

      - name: 装 cargo-packager
        run: cargo install cargo-packager --locked

      - name: 打包（NSIS + 核心层）
        run: node scripts/pack-rs.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-X-windows
          path: release/packager/*-setup.exe
          if-no-files-found: error

      - name: 挂到同 tag 的 Release 上
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "还没有 $tag 的 Release，产物先留在 workflow artifacts 里"
            exit 0
          fi
          gh release upload "$tag" release/packager/*-setup.exe --clobber

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # registry-url 是为了 npm publish（核心包）能拿到 .npmrc 的鉴权；装不装包都无所谓。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # eframe/winit 编译要 X11/Wayland 头；rfd 走 xdg-desktop-portal，要 dbus 开发包。
      - name: 装系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev pkg-config

      - name: 跑测试
        run: npm test -- --test-timeout=120000

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell-rs

      - name: 装 cargo-packager
        run: cargo install cargo-packager --locked

      - name: 打包（AppImage + deb）
        run: node scripts/pack-rs.mjs

      # 核心包跨平台，打一份发所有平台；pack-rs 已经把 release/rs-stage/core 组装好了。
      # 只改外壳版本时核心版本不变，pack-core 会先 npm view 再决定发不发。
      - name: 打包并发布核心 npm 包
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "没有 NPM_TOKEN，跳过核心包发布"; exit 0; fi
          node scripts/pack-core.mjs --publish

      - uses: actions/upload-artifact@v4
        with:
          name: DSH-X-linux
          path: |
            release/packager/*.AppImage
            release/packager/*.deb
          if-no-files-found: error

      - name: 挂到同 tag 的 Release 上
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/packager/*.AppImage release/packager/*.deb --clobber
          else
            echo "还没有 $tag 的 Release，产物先留在 workflow artifacts 里"
          fi

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            arch: arm64
          - runner: macos-15-intel # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # cargo-packager 的 dmg 要 .icns；仓库里现在只有 png/ico（make-icons.py 还没出 icns），
      # 没有就先跳过，别让 mac job 红着骗人。补上 assets/icon.icns 后这里会自动开始出包。
      - name: 有没有 .icns
        id: icns
        run: |
          if [ -f assets/icon.icns ]; then echo "ready=yes" >> "$GITHUB_OUTPUT"; else echo "ready=no" >> "$GITHUB_OUTPUT"; echo "缺 assets/icon.icns，跳过 mac 打包"; fi

      - uses: actions/setup-node@v4
        if: steps.icns.outputs.ready == 'yes'
        with:
          node-version: '22'

      - name: 跑测试
        if: steps.icns.outputs.ready == 'yes'
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        if: steps.icns.outputs.ready == 'yes'

      - uses: Swatinem/rust-cache@v2
        if: steps.icns.outputs.ready == 'yes'
        with:
          workspaces: shell-rs

      - name: 装 cargo-packager
        if: steps.icns.outputs.ready == 'yes'
        run: cargo install cargo-packager --locked

      - name: 打包（.app + dmg）
        if: steps.icns.outputs.ready == 'yes'
        run: node scripts/pack-rs.mjs

      - uses: actions/upload-artifact@v4
        if: steps.icns.outputs.ready == 'yes'
        with:
          name: DSH-X-mac-${{ matrix.arch }}
          path: release/packager/*.dmg
          if-no-files-found: error

      - name: 挂到同 tag 的 Release 上
        if: steps.icns.outputs.ready == 'yes' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/packager/*.dmg --clobber
          else
            echo "还没有 $tag 的 Release，dmg 先留在 workflow artifacts 里"
          fi